<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Balram's AI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- App CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

  <!-- Fonts (optional, for nicer typography) -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

  <!-- Markdown & Sanitizer & Code Highlight -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github.min.css">
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/highlight.min.js"></script>
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="title">
        <span class="logo">🤖</span>
        <h1>Balram's AI</h1>
      </div>
      <div class="actions">
        <button id="theme-toggle" title="Toggle theme">🌙</button>
      </div>
    </header>

    <main id="messages" class="messages"></main>

    <div id="typing" class="typing" style="display:none;">
      <span></span><span></span><span></span>
    </div>

    <footer class="composer">
      <input id="input" type="text" placeholder="Ask me anything… (Shift+Enter for newline)" autocomplete="off" />
      <button id="send" class="send">Send</button>
    </footer>
  </div>

  <!-- App JS -->
  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
